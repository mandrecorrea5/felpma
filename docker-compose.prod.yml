# =============================================================================
# Overlay de produção (VPS) — divide a máquina com o stack do ranking-lpo.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile producao up -d --build
#
# Diferenças em relação ao docker-compose.yml de dev:
#   - Nenhuma porta publicada no host. Quem fala com a internet é o Caddy que já
#     roda em /opt/ranking-lpo (ele atinge este container pela network `ingress`).
#     Um segundo Caddy/nginx na mesma VPS não é possível: 80/443 já estão tomados.
#   - A network externa `ingress` precisa existir antes do primeiro up:
#       docker network create ingress
#   - Nomes de container fixos: é por `felpma-site` que o Caddyfile resolve o
#     upstream via DNS interno do Docker.
#   - Healthcheck no site (o CI usa para só dar deploy como verde depois que ele
#     sobe) + limites de CPU/memória (a VPS tem 1 CPU).
#
# Um `down -v` aqui APAGA o banco e os uploads. Ver seção de produção no README.
# =============================================================================

networks:
  felpma-net:
    driver: bridge
  ingress:
    external: true

services:
  postgres:
    container_name: felpma-postgres
    networks:
      - felpma-net
    ports: !reset []
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 384M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  site:
    container_name: felpma-site
    build:
      context: .
      # Next embute NEXT_PUBLIC_* no momento do build. Sem passar o valor como
      # build arg, sitemap/robots/metadata saem com o fallback localhost:3000.
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:?defina NEXT_PUBLIC_SERVER_URL no .env}
    networks:
      - felpma-net
      - ingress
    ports: !reset []
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://127.0.0.1:3000/healthz']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 768M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Backup: dump do Postgres + tar.gz dos dois volumes de upload, 03:00 todo dia.
  #
  # Os volumes do próprio compose entram montados aqui (compose resolve o
  # prefixo do projeto, ex.: felpma_uploads-media) — por isso o script não
  # precisa conhecer o nome real dos volumes. Read-only de propósito: backup que
  # escreve no dado original não é backup.
  #
  # Os artefatos ficam em ./deploy/backup/backups (bind mount) — some isso ao
  # disco que o stack do ranking-lpo já ocupa na VPS. Daí a retenção curta local
  # (14d) com o R2 segurando 30d.
  # ---------------------------------------------------------------------------
  backup:
    build:
      context: ./deploy/backup
    container_name: felpma-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: felpma
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      PGDATABASE: felpma
      BACKUP_RETENTION_DAYS: "14"
      BACKUP_REMOTE_RETENTION_DAYS: "30"
      BACKUP_CRON: "0 3 * * *"
      # Cloudflare R2 — opcionais. Sem os quatro, o upload é pulado e o backup
      # fica só no disco da VPS (ou seja: sem backup nenhum se o disco morrer).
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      # healthchecks.io — opcional. Ficar em silêncio é o sinal de problema.
      HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}
    volumes:
      - ./deploy/backup/backups:/backups
      - uploads-media:/uploads/media:ro
      - uploads-documentos:/uploads/documentos:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - felpma-net
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
