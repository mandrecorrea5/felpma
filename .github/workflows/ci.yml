name: CI

on:
  push:
    branches: [main]
  pull_request:
  # CD: todo push em main publica. workflow_dispatch fica só pra re-publicar
  # o que já está no ar sem mudar código (redeploy depois de mexer no .env, por
  # exemplo). Ver job `deploy` abaixo.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint / typecheck / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Sem `version` aqui: o action-setup lê o packageManager do package.json.
      # Fixar nos dois lugares é como o CI validou com um pnpm e o `docker build`
      # (corepack) usou outro — foi o que quebrou o build na VPS.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: install
        run: pnpm install --frozen-lockfile
      - name: lint
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      # O build não precisa de banco: as páginas que consultam o Payload são
      # renderizadas na primeira visita.
      - name: build
        env:
          NEXT_PUBLIC_SERVER_URL: https://felpma.com.br
        run: pnpm build

  deploy:
    name: Deploy
    needs: quality
    # `!= pull_request` e nao `== push` de proposito: continua valendo o
    # workflow_dispatch pra re-publicar sem commit novo. E PR aberto jamais
    # publica — o script abaixo faz reset numa branch fixa do servidor, então um
    # deploy disparado por PR publicaria o main, nao o codigo do PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-felpma
      cancel-in-progress: false
    steps:
      # A chave do CI é travada no servidor (`restrict,command=`): só consegue
      # rodar /usr/local/bin/felpma-deploy, que aceita apenas "deploy <sha>".
      # Instalação e detalhes em deploy/remote-deploy.sh.
      - name: Chave SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # SHA deste run, não a ponta de origin/main. Com CD automático dois
      # pushes em sequência entram na fila e o `concurrency` acima só
      # serializa: cada deploy publica exatamente o commit que ele validou.
      - name: Publicar
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes \
            "$USER@$HOST" "deploy ${{ github.sha }}"

  smoke:
    name: Smoke test (prod)
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: healthz
        run: |
          for i in {1..24}; do
            code=$(curl -s -o /dev/null --connect-timeout 3 --max-time 10 -w "%{http_code}" https://felpma.com.br/healthz || echo "000")
            echo "attempt $i: $code"
            [ "$code" = "200" ] && exit 0
            sleep 5
          done
          echo "::error::/healthz never returned 200"; exit 1
      - name: home
        run: |
          code=$(curl -s -o /dev/null --connect-timeout 3 --max-time 30 -w "%{http_code}" https://felpma.com.br/)
          echo "home: $code"
          [ "$code" = "200" ] || exit 1
      - name: admin
        run: |
          code=$(curl -s -o /dev/null --connect-timeout 3 --max-time 30 -w "%{http_code}" https://felpma.com.br/admin)
          echo "admin: $code"
          case "$code" in
            200|302|307) exit 0 ;;
            *) exit 1 ;;
          esac
      - name: www redirects
        run: |
          code=$(curl -s -o /dev/null --connect-timeout 3 --max-time 10 -w "%{http_code}" https://www.felpma.com.br/healthz)
          loc=$(curl -s -o /dev/null --connect-timeout 3 --max-time 10 -w "%{redirect_url}" https://www.felpma.com.br/)
          echo "www: $code -> $loc"
          [ "$code" = "301" ] || exit 1
