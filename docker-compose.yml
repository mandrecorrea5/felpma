# Desenvolvimento: sobe só o Postgres.
#   docker compose up -d
#
# Produção (servidor/VPS): sobe Postgres + site.
#   docker compose --profile producao up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: felpma
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-felpma}
      POSTGRES_DB: felpma
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U felpma']
      interval: 5s
      retries: 10

  site:
    profiles: ['producao']
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://felpma:${POSTGRES_PASSWORD:-felpma}@postgres:5432/felpma
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:?defina PAYLOAD_SECRET no .env}
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL:-http://localhost:3000}
      # LGPD: sem estas duas o app se recusa a gravar dado pessoal (de propósito).
      # Gere uma vez e guarde a chave fora do servidor — perdê-la é perder os dados cifrados.
      LGPD_CHAVE_CAMPOS: ${LGPD_CHAVE_CAMPOS:?defina LGPD_CHAVE_CAMPOS no .env}
      LGPD_HASH_SALT: ${LGPD_HASH_SALT:?defina LGPD_HASH_SALT no .env}
      # Resend: sem as duas primeiras variáveis o cadastro fica bloqueado em
      # produção (em dev o link de ativação sai no terminal).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-FELPMA}
    ports:
      - '3000:3000'
    volumes:
      # Imagens e PDFs enviados pelo painel
      - uploads-media:/app/media
      - uploads-documentos:/app/documentos

volumes:
  pgdata:
  uploads-media:
  uploads-documentos:
